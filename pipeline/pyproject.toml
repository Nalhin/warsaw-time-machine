[project]
name = "wtm-pipeline"
version = "0.1.0"
description = "Restoration pipeline for Warszawa 1935/1945/dziś: Real-ESRGAN upscale + DDColor colorization"
requires-python = ">=3.11,<3.14"
dependencies = [
    "torch>=2.4",
    "spandrel>=0.4",
    "onnxruntime>=1.19",
    "opencv-python-headless>=4.10",
    "numpy>=1.26",
    "pillow>=10.4",
]

[project.optional-dependencies]
# Only needed to export DDColor to ONNX yourself (export_ddcolor.py)
export = ["huggingface_hub>=0.24", "onnx>=1.16", "timm>=1.0", "onnxscript>=0.1"]

[tool.uv]
package = false
